name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Build cmach
        run: make

      - name: Strip binary
        run: strip out/bin/cmach

      - name: Upload release binary
        uses: softprops/action-gh-release@v3
        with:
          files: out/bin/cmach
          body: |
            Pre-built bootstrap compiler for mach.

            Download `cmach`, make it executable, and use it to build mach:
            ```bash
            chmod +x cmach
            CMACH=./cmach make
            ```
